name: Flint

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: macos-latest
            python-version: '3.14'
          - os: windows-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install . docutils
      - name: Install graph renderer
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Run tests
        run: python -m unittest discover -s test -v

  package:
    name: Build and check distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate metadata and README
        run: python -m twine check --strict dist/*
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Check installed CLI outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          flint --help
          python -m flint --help
          python -c "import flint.docgen.model; import flint.formatting.rules"
      - name: Check editable installation
        run: |
          python -m pip install -e .
          flint --version
